<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لخصلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1b3a'/%3E%3Cg fill='%23d4af5f' transform='translate(14 14) scale(3)'%3E%3Cpath d='M12 3 1 9l11 6 9-4.9V17h2V9L12 3z'/%3E%3Cpath d='M5 13.2v4L12 21l7-3.8v-4L12 17l-7-3.8z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#07122b;--card:rgba(255,255,255,.055);--card-h:rgba(255,255,255,.09);--ink:#f4efe1;--mut:rgba(244,239,225,.62);--gold:#d4af5f;--gold2:#f0d189;--line:rgba(255,255,255,.11);--on:#0b1b3a;--glass:rgba(7,18,43,.72);--glow:rgba(212,175,95,.35);--op:.13;--red:#e5736b}
[data-theme=light]{--bg:#f7f3e8;--card:#ffffff;--card-h:#fffaf0;--ink:#0b1b3a;--mut:rgba(11,27,58,.62);--gold:#b8892d;--gold2:#d4af5f;--line:rgba(11,27,58,.12);--on:#0b1b3a;--glass:rgba(247,243,232,.78);--glow:rgba(184,137,45,.3);--op:.28}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-weight:400;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .35s,color .35s;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(600px 420px at 8% -5%,var(--glow),transparent 70%),radial-gradient(700px 500px at 100% 100%,rgba(70,110,220,.18),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--contour);opacity:var(--op);pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
button,input,select,textarea{font:inherit;color:inherit}
.mut{color:var(--mut)}
/* الهيدر */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 4vw}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;cursor:pointer;margin-left:auto}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#12264d,#0b1b3a);border:1px solid var(--gold);display:grid;place-items:center;transition:transform .4s}
.brand:hover .lg{transform:rotate(-8deg) scale(1.08)}
.nav{display:flex;gap:4px}
.nav button,.ic{position:relative;overflow:hidden;background:none;border:0;padding:9px 16px;border-radius:12px;cursor:pointer;color:var(--mut);transition:color .2s,background .2s,transform .15s}
.nav button:hover{color:var(--ink);background:var(--card)} .nav button:active,.ic:active{transform:scale(.94)}
.nav .on{color:var(--on);background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:700;box-shadow:0 6px 18px -6px var(--glow)}
.nav .editon{outline:2px solid var(--gold);color:var(--ink)}
.lv{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.lv button{position:relative;z-index:1;width:42px;padding:6px 0;border:0;background:none;cursor:pointer;font-weight:700;color:var(--mut);transition:color .25s}
.lv .thumb{position:absolute;top:3px;bottom:3px;right:3px;width:42px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),var(--gold));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.lv[data-l="2"] .thumb{transform:translateX(-42px)}
.lv button.on{color:var(--on)}
.ic{width:40px;height:40px;padding:0;border:1px solid var(--line);background:var(--card);font-size:17px}
.ic:hover{transform:rotate(20deg) scale(1.08);border-color:var(--gold)}
/* الأزرار */
.btn,.opt,.tile{position:relative;overflow:hidden}
.rip::after{content:"";position:absolute;left:var(--x);top:var(--y);width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out}
@keyframes rip{to{transform:translate(-50%,-50%) scale(26);opacity:0}}
.btn{border:0;cursor:pointer;padding:12px 24px;border-radius:14px;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 8px 22px -8px var(--glow);transition:transform .2s,box-shadow .2s,filter .2s}
.btn::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 28px -8px var(--glow)} .btn:hover::before{left:130%}
.btn:active{transform:scale(.95)} .btn:disabled{opacity:.45;pointer-events:none}
.btn.red{background:linear-gradient(135deg,#e5736b,#b8423c);color:#fff;box-shadow:none}
.btn.sm{padding:6px 14px;font-size:13px;border-radius:10px}
/* المحتوى */
main{max-width:1060px;margin:0 auto;padding:44px 4vw 80px}
main>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both} main>*:nth-child(2){animation-delay:.07s} main>*:nth-child(3){animation-delay:.14s} main>*:nth-child(4){animation-delay:.21s} main>*:nth-child(n+5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--gold2);font-size:13px;margin-bottom:12px}
.pill a{color:inherit;text-decoration:none}
h1{font-size:clamp(32px,6vw,58px);line-height:1.2;font-weight:800;background:linear-gradient(120deg,var(--ink) 30%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=light] h1{background:linear-gradient(120deg,#0b1b3a 40%,#b8892d);-webkit-background-clip:text;background-clip:text}
.sub{color:var(--mut);margin:10px 0 32px;max-width:52ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:38px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat b{display:block;font-size:34px;line-height:1.1;font-weight:800} .stat span{color:var(--mut);font-size:13px}
.ring{--p:0;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;transition:background .6s}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)} .ring i{position:relative;font:normal 700 13px system-ui}
h3.sec{font-size:20px;margin-bottom:16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:34px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.4,.5,1),border-color .25s,background .25s,box-shadow .3s}
.tile:hover{transform:translateY(-7px) scale(1.02);border-color:var(--gold);background:var(--card-h);box-shadow:0 22px 36px -18px var(--glow)}
.tile:active{transform:scale(.97)}
.tile .em{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,rgba(212,175,95,.28),rgba(212,175,95,.06));margin-bottom:16px;transition:transform .35s}
.tile:hover .em{transform:rotate(-10deg) scale(1.12)}
.tile h4{font-size:18px;font-weight:700} .tile small{color:var(--mut)}
.tile .go{position:absolute;left:18px;bottom:18px;color:var(--gold2);opacity:0;transform:translateX(10px);transition:.3s}
.tile:hover .go{opacity:1;transform:none}
.tile .btn{position:absolute;left:12px;top:12px;z-index:2}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0 26px}
.tabs button{position:relative;overflow:hidden;border:0;background:none;padding:9px 22px;border-radius:11px;cursor:pointer;color:var(--mut);transition:.25s}
.tabs button:hover{color:var(--ink)} .tabs .on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;transition:transform .25s,border-color .25s}
.row:hover{transform:translateX(-6px);border-color:var(--gold)} .row .go{color:var(--gold2)}
.adm{margin-top:26px;padding:22px;border:1.5px dashed var(--gold);border-radius:20px;background:var(--card);display:grid;gap:12px}
.adm h4{color:var(--gold2);font-size:16px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--glow)}
select option{background:var(--bg)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:740px}
.qcard h3{font-size:22px;margin:10px 0 22px;line-height:1.7;font-weight:700}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .5s}
.opt{display:block;width:100%;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:transform .2s,border-color .2s}
.opt:hover:not(:disabled){transform:translateX(-6px);border-color:var(--gold)} .opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{background:#1f8a58;border-color:#1f8a58;color:#fff;animation:pop .5s} .opt.no{background:#b24444;border-color:#b24444;color:#fff;animation:shake .45s}
@keyframes pop{40%{transform:scale(1.04)}} @keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
.exp{margin:14px 0;color:var(--mut);padding:12px 14px;border-radius:12px;background:var(--bg)}
.res{text-align:center;padding:44px 20px} .res b{display:block;font-size:68px;font-weight:800;color:var(--gold2);animation:pop .7s}
.empty{padding:40px;text-align:center;border:1.5px dashed var(--line);border-radius:20px;color:var(--mut)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);padding:11px 24px;border-radius:99px;z-index:99;font-weight:700;animation:up .35s both;box-shadow:0 10px 30px -8px var(--glow)}
@media(max-width:760px){
 .top{padding:10px 14px;gap:8px} .brand{font-size:19px} .brand .lg{width:34px;height:34px}
 .nav{position:fixed;bottom:0;right:0;left:0;z-index:40;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
 .nav button{flex:1;padding:10px 4px;font-size:13px}
 .stats{grid-template-columns:1fr} main{padding:28px 16px 110px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="go('home')"><span class="lg"><svg width="22" height="22" viewBox="0 0 24 24" fill="#d4af5f"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3z"/><path d="M5 13.2v4L12 21l7-3.8v-4L12 17l-7-3.8z"/></svg></span>لخصلي</div>
  <nav class="nav"><button data-v="home" onclick="go('home')">الرئيسية</button><button data-v="data" onclick="go('data')">بياناتي</button><button id="edt" onclick="toggleEdit()">وضع التعديل</button></nav>
  <div class="lv" id="lv" data-l="1"><span class="thumb"></span><button onclick="setLv(1)" title="المستوى الأول">١</button><button onclick="setLv(2)" title="المستوى الثاني">٢</button></div>
  <button class="ic" id="tbtn" onclick="setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark')" title="ليلي / صباحي">☀</button>
</header>
<main id="main"></main>
<script>
/* خطوط الكنتور */
(function(){const ring=(cx,cy,r,ph)=>{let d='';for(let i=0;i<=360;i+=6){const t=i*Math.PI/180,k=r*(1+.05*Math.sin(3*t+ph)+.03*Math.sin(5*t+ph*1.7));d+=(i?'L':'M')+(cx+k*Math.cos(t)*1.25).toFixed(1)+' '+(cy+k*Math.sin(t)*.9).toFixed(1)}return '<path d="'+d+'Z"/>'};
let b='';for(let k=1;k<=9;k++)b+=ring(260,270,24*k,.6);for(let k=1;k<=7;k++)b+=ring(620,570,22*k,2.1);
const svg='<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" fill="none" stroke="#c9a24b" stroke-width="1.1">'+b+'</svg>';
document.documentElement.style.setProperty('--contour','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")')})();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV=n=>n==1?'المستوى الأول':'المستوى الثاني';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}$('#tbtn').textContent=t=='dark'?'☀':'☾'}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
/* تأثير الموجة عند الضغط */
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.opt,.tile,.nav button,.tabs button');if(!b)return;const r=b.getBoundingClientRect();b.style.setProperty('--x',e.clientX-r.left+'px');b.style.setProperty('--y',e.clientY-r.top+'px');b.classList.remove('rip');void b.offsetWidth;b.classList.add('rip')});

/* التخزين داخل المتصفح */
const KEY='lakhaslee_v1';
const blank=()=>({level:1,edit:false,subjects:{1:[],2:[]},summaries:{},questions:{},solved:{}});
const norm=x=>{x=Object.assign(blank(),x&&typeof x=='object'?x:{});x.subjects=Object.assign({1:[],2:[]},x.subjects);[1,2].forEach(n=>{if(!Array.isArray(x.subjects[n]))x.subjects[n]=[]});['summaries','questions','solved'].forEach(k=>{if(!x[k]||typeof x[k]!='object')x[k]={}});if(x.level!=2)x.level=1;x.edit=false;return x};
let D;try{D=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){D=norm()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('تعذر الحفظ في المتصفح')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let Q=null,SID=null,VIEW='home',CUR='sum';

function sync(){
  document.querySelectorAll('.nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==VIEW));
  const lv=$('#lv');lv.dataset.l=D.level;lv.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',D.level==i+1));
  $('#edt').textContent=D.edit?'التعديل: مفعّل ✓':'وضع التعديل';$('#edt').classList.toggle('editon',D.edit);
}
function setLv(n){D.level=n;save();go('home')}
function toggleEdit(){D.edit=!D.edit;sync();SID?drawSubj(CUR):go(VIEW)}
function go(v){VIEW=v;SID=null;sync();window.scrollTo({top:0,behavior:'smooth'});({home,data}[v])()}

/* الرئيسية */
function home(){
  const subs=D.subjects[D.level],ids=subs.flatMap(s=>(D.questions[s.id]||[]).map(q=>q.id));
  const solved=ids.filter(i=>D.solved[i]).length,pct=ids.length?Math.round(solved/ids.length*100):0;
  $('#main').innerHTML=`<div><span class="pill">${LV(D.level)}</span><h1>مذاكرتك أسهل<br>مع لخصلي</h1><p class="sub">ملخصاتك وبنك أسئلتك في مكان واحد. اختار مادة وابدأ.</p></div>
<div class="stats"><div class="stat"><div><b>${subs.length}</b><span>مادة</span></div></div><div class="stat"><div><b>${solved}</b><span>سؤال تم حله صح</span></div></div><div class="stat"><div><b>${ids.length}</b><span>سؤال في البنك</span></div><div class="ring" style="--p:${pct}"><i>${pct}%</i></div></div></div>
<div><h3 class="sec">المواد</h3><div class="grid">${subs.map((s,i)=>`<article class="tile" onclick="subj('${s.id}')"><div class="em">${esc(s.icon||'📘')}</div><h4>${esc(s.name)}</h4><small>${(D.summaries[s.id]||[]).length} ملخص · ${(D.questions[s.id]||[]).length} سؤال</small><span class="go">←</span>${D.edit?`<button class="btn red sm" onclick="event.stopPropagation();delSub('${s.id}')">حذف</button>`:''}</article>`).join('')||`<div class="empty" style="grid-column:1/-1">لا توجد مواد بعد.${D.edit?'':'<br>فعّل «وضع التعديل» من القائمة وأضف أول مادة.'}</div>`}</div>
${D.edit?`<form class="adm" onsubmit="return addSub(event)"><h4>إضافة مادة (${LV(D.level)})</h4><input id="s_name" placeholder="اسم المادة" required><input id="s_icon" placeholder="أيقونة (إيموجي)"><button class="btn">إضافة</button></form>`:''}</div>`;
}
function addSub(e){e.preventDefault();D.subjects[D.level].push({id:uid(),name:$('#s_name').value.trim(),icon:Array.from($('#s_icon').value.trim())[0]||'📘'});save();home();return false}
function delSub(id){if(!confirm('حذف المادة بكل ملخصاتها وأسئلتها؟'))return;D.subjects[D.level]=D.subjects[D.level].filter(s=>s.id!=id);delete D.summaries[id];delete D.questions[id];save();home()}

/* المادة */
function subj(id,tab){SID=id;window.scrollTo({top:0,behavior:'smooth'});drawSubj(tab||'sum')}
function drawSubj(tab){
  CUR=tab;const s=D.subjects[D.level].find(x=>x.id==SID);if(!s)return go('home');
  const sum=D.summaries[SID]||[],qs=D.questions[SID]||[];let body='';
  if(tab=='sum'){
    body=[...sum].reverse().map(x=>`<a class="row" href="${esc(x.url)}" target="_blank" rel="noopener"><span>📄 ${esc(x.title)}</span>${D.edit?`<button class="btn red sm" onclick="event.preventDefault();delItem('summaries','${x.id}')">حذف</button>`:'<span class="go">فتح ↗</span>'}</a>`).join('')||'<div class="empty">لا توجد ملخصات بعد.</div>';
    if(D.edit)body+=`<form class="adm" onsubmit="return addSum(event)"><h4>إضافة ملخص</h4><input id="m_t" placeholder="عنوان الملخص" required><input id="m_url" placeholder="الرابط (Google Drive أو غيره) https://..." required><button class="btn">إضافة</button></form>`;
  }else{
    body=`<div class="qcard"><span class="mut">${qs.length} سؤال في البنك</span><h3>اختبر نفسك</h3><button class="btn" ${qs.length?'':'disabled'} onclick="startQuiz()">ابدأ الاختبار</button></div>`;
    if(D.edit)body+=`<form class="adm" onsubmit="return addQ(event)"><h4>إضافة سؤال</h4><textarea id="q_q" rows="2" placeholder="نص السؤال" required></textarea>${[0,1,2,3].map(i=>`<input id="q_${i}" placeholder="الاختيار ${i+1}" required>`).join('')}<select id="q_a">${[0,1,2,3].map(i=>`<option value="${i}">الإجابة الصحيحة: ${i+1}</option>`).join('')}</select><input id="q_e" placeholder="شرح الإجابة (اختياري)"><button class="btn">إضافة</button></form>
<form class="adm" onsubmit="return importQ(event)"><h4>استيراد أسئلة JSON</h4><textarea id="q_json" rows="4" placeholder='[{"q":"السؤال","o":["أ","ب","ج","د"],"a":0,"e":"شرح"}]' required></textarea><button class="btn">استيراد</button></form>
${qs.map(x=>`<div class="row"><span>${esc(x.q)}</span><button class="btn red sm" onclick="delItem('questions','${x.id}')">حذف</button></div>`).join('')}`;
  }
  $('#main').innerHTML=`<div><span class="pill">${LV(D.level)} · <a href="#" onclick="go('home');return false">المواد</a></span><h1 style="font-size:clamp(28px,5vw,46px)">${esc(s.icon||'')} ${esc(s.name)}</h1></div>
<div style="margin-top:22px"><div class="tabs"><button class="${tab=='sum'?'on':''}" onclick="drawSubj('sum')">الملخصات</button><button class="${tab=='quiz'?'on':''}" onclick="drawSubj('quiz')">بنك الأسئلة</button></div>${body}</div>`;
}
function delItem(kind,id){if(!confirm('تأكيد الحذف؟'))return;D[kind][SID]=(D[kind][SID]||[]).filter(x=>x.id!=id);save();drawSubj(CUR)}
function addSum(e){e.preventDefault();const u=$('#m_url').value.trim();if(!/^https?:\/\//i.test(u)){toast('الرابط لازم يبدأ بـ https://');return false}
  (D.summaries[SID]=D.summaries[SID]||[]).push({id:uid(),title:$('#m_t').value.trim(),url:u});save();drawSubj('sum');return false}
function addQ(e){e.preventDefault();
  (D.questions[SID]=D.questions[SID]||[]).push({id:uid(),q:$('#q_q').value.trim(),o:[0,1,2,3].map(i=>$('#q_'+i).value.trim()),a:+$('#q_a').value,e:$('#q_e').value.trim()});save();toast('تمت الإضافة');drawSubj('quiz');return false}
function importQ(e){e.preventDefault();let arr;
  try{arr=JSON.parse($('#q_json').value);if(!Array.isArray(arr))throw 0;arr=arr.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length)}catch(x){toast('صيغة JSON غير صحيحة');return false}
  if(!arr.length){toast('لا توجد أسئلة صالحة');return false}
  (D.questions[SID]=D.questions[SID]||[]).push(...arr.map(x=>({id:uid(),q:String(x.q),o:x.o.map(String),a:x.a,e:String(x.e||'')})));save();toast('تم استيراد '+arr.length+' سؤال');drawSubj('quiz');return false}

/* الاختبار */
function startQuiz(){Q={list:[...(D.questions[SID]||[])].sort(()=>Math.random()-.5),i:0,ok:0,done:false};drawQ()}
function drawQ(){
  const q=Q.list[Q.i],box=document.querySelector('.qcard'),n=Q.list.length;
  if(!q){box.className='qcard res';box.innerHTML=`<b>${Q.ok}/${n}</b><p class="mut">إجابات صحيحة</p><br><button class="btn" onclick="drawSubj('quiz')">رجوع</button>`;return}
  box.innerHTML=`<div class="bar"><i style="width:${Q.i/n*100}%"></i></div><span class="mut">سؤال ${Q.i+1} من ${n}</span><h3>${esc(q.q)}</h3>${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${esc(o)}</button>`).join('')}<div id="fb"></div>`;
}
function pick(k){
  if(Q.done)return;Q.done=true;const q=Q.list[Q.i];
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});
  if(k==q.a){Q.ok++;D.solved[q.id]=true;save()}
  $('#fb').innerHTML=(q.e?`<p class="exp">${esc(q.e)}</p>`:'')+`<button class="btn" onclick="Q.i++;Q.done=false;drawQ()">${Q.i+1<Q.list.length?'التالي':'النتيجة'}</button>`;
}

/* بياناتي */
function data(){
  $('#main').innerHTML=`<div><span class="pill">نسخة احتياطية</span><h1>بياناتي</h1><p class="sub">كل البيانات محفوظة داخل متصفح الجهاز ده بس. صدّرها كملف عشان تنقلها لجهاز تاني أو تحتفظ بنسخة.</p></div>
<div class="adm" style="margin-top:0"><h4>تصدير</h4><div><button class="btn" onclick="exportData()">تحميل ملف JSON</button></div></div>
<div class="adm"><h4>استيراد</h4><input type="file" accept=".json,application/json" onchange="importData(this)"></div>
<div class="adm"><h4>مسح</h4><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" onclick="resetProgress()">مسح تقدمي فقط</button><button class="btn red" onclick="resetAll()">مسح كل شيء</button></div></div>`;
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='lakhaslee-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.subjects)throw 0;D=norm(x);save();toast('تم الاستيراد');go('home')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function resetProgress(){if(confirm('مسح تقدمك في الأسئلة؟')){D.solved={};save();toast('تم المسح')}}
function resetAll(){if(confirm('مسح كل المواد والملخصات والأسئلة؟')){D=norm();save();go('home')}}

go('home');
</script>
